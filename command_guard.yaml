rules:
  - name: rm command
    description: This rule checks rm command and ask reason why you execute this command.
    filter: rm*
    input_prompt: "Are you sure (Y/N)"
    allow_input: Y
    reason_require: true

  - name: hostname command
    description: This rule checks hostname command if user run hostname then it execute the provided bash file which send the relevent to the endtool via the webhook.
    filter: hostname*
    input_prompt: "Are you sure you want to execute this command (allow/deny)"
    allow_input: allow
    reason_require: true
    deny: false
    commands: 
      - bash /home/swapnil/send_email.sh
    command_output_debug: true
